[display]

; ============================================================================
;  4K 竖屏出片档位（2160×3840）
; ============================================================================
;
; 用法 —— 就三步：
;
;   Copy-Item godot-ballgame\tools\tier_4k.cfg godot-ballgame\override.cfg
;   & $exe --path godot-ballgame --write-movie captures/round_4k.avi
;   Remove-Item godot-ballgame\override.cfg
;
; `res://override.cfg` 是引擎**官方**的工程设置覆盖机制（见本地离线文档
; `classes/class_projectsettings.rst.txt` 开头的 "Overriding"）：启动时读取，
; 只覆盖这里列出的键，其余照旧。所以它是一个「档位开关」，不需要改
; `project.godot`，也不会污染版本库（`override.cfg` 已进 `.gitignore`）。
;
; 为什么只写带 `.movie` 后缀的键：不加后缀的话预览窗口也会变成 2160×3840，
; 在 1080p 显示器上会被裁成横屏。加了 `.movie` 就**只影响录制**。
;
; 为什么是「窗口 override」而不是「视口尺寸」：出片分辨率在 `canvas_items`
; 拉伸模式下由 `window_*_override` 决定（实测；`viewport` 模式下才由
; `viewport_*` 决定）。所以升档只要覆盖这两个键，逻辑尺寸仍是 1080×1920 ——
; 构图、UI 字号、侧栏宽度全部原样，画面只是多了 4 倍像素。
;
; ⚠️ 别用命令行 `--resolution 2160x3840` 代替本文件：实测对出片无效。
;
; 实测（本机 1080p 屏）：
;   project.godot 的 .movie = 1080×1920 + 本文件       → 出片 2160×3840 ✅
;   删掉本文件                                          → 出片 1080×1920 ✅
;   两种情况预览窗口都是 540×960（不受影响）✅
window/size/window_width_override.movie=2160
window/size/window_height_override.movie=3840
