; ============================================================================
;  godot-ballgame 粒子参数 —— **可选覆盖文件**
; ============================================================================
;
; 默认值全部在 `scripts/config.gd` 的 `Config.PARTICLES` 里，**本文件出厂是全注释的**。
; 之所以留着它，是为了不改代码就能临时试参数。
;
; 取值优先级（高 → 低）：
;
;     particles.cfg（本文件，只认它**显式写出**的键）
;       > Config.PARTICLES（scripts/config.gd）
;         > particle_fx.tscn 里保存的值
;
; 也就是说：想长期生效就改 `config.gd`；只想快速试一下就取消下面某几行的注释。
; 一个字都没写的 section 等于不存在，不会把 Config 的值清掉。
;
; 想调更多官方参数（湍流 turbulence、子发射器 sub_emitter、发射形状、
; 生命周期曲线……）请直接在编辑器中打开 `particle_fx.tscn`。
;
; 官方文档（本机离线）：
;   E:\Godot\Godot_v4.6.2-stable_win64\tools\hastur-operation-plugin\godot-docs\
;     classes\class_gpuparticles2d.rst.txt
;     classes\class_particleprocessmaterial.rst.txt
; ----------------------------------------------------------------------------

; [burst]
; ; 球撞到圆环实心处的碰撞反馈
; one_shot=true
; amount=18
; lifetime=0.35
; explosiveness=1.0
; spread=45
; velocity_min=100.0
; velocity_max=220.0
; damping_min=20.0
; damping_max=60.0
; gravity=60.0
; scale_min=1.6
; scale_max=3.2
; emission_radius=6.0

; [ring_break]
; ; 球从缺口逃出、圆环碎裂（整圈铺开）
; one_shot=true
; amount=18
; lifetime=0.45
; explosiveness=1.0
; spread=180
; velocity_min=60.0
; velocity_max=260.0
; damping_min=10.0
; damping_max=40.0
; gravity=40.0
; scale_min=1.8
; scale_max=4.0
; emission_radius=6.0

; [trail]
; ; 小球运动轨迹（官方 trail_enabled 拖尾）
; ;
; ; 参数按球的真实屏幕速度标定：球在屏幕上约 85px/s。
; ; 实测（受控直线实验，发射器后方轨迹延伸）：amount=160/lifetime=1.2 时约 106px。
; ; Config 里的取值按比例收短到约 60px，与球半径(约 8px)的比例更协调。
; enabled=true
; amount=120
; lifetime=0.8
; spread=18
; ; 初速取球的屏幕速度量级，粒子才会"跟着球走一段"而不是停在原地
; velocity_min=20.0
; velocity_max=80.0
; damping_min=10.0
; damping_max=30.0
; gravity=0.0
; ; 注意：粒子屏上尺寸 ≈ scale_max × lifetime（像素），所以 scale 必须随 lifetime 联动。
; scale_min=0.5
; scale_max=0.9
; ; 每几帧发射一次（1=每帧，最密）。官方没有发射频率参数，靠抽帧实现
; sample_interval=1
; ; 发射球半径 = 小球世界半径 × 该系数
; emission_radius_scale=0.5
